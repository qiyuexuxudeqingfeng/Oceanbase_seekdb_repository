name: Competition AI status monitor

on:
  workflow_dispatch:
  push:
    branches: [competition/ai-functions]
    paths:
      - ".github/workflows/competition-monitor.yml"

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Collect workflow and job states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/competition-ai-functions.yml/runs?branch=competition%2Fai-functions&per_page=10" \
            --output "$RUNNER_TEMP/ai-runs.json"
          for run_id in $(python3 -c 'import json; print(" ".join(str(run["id"]) for run in json.load(open("'$RUNNER_TEMP'/ai-runs.json"))["workflow_runs"]))'); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --output "$RUNNER_TEMP/ai-jobs-${run_id}.json"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          runs = json.loads((root / "ai-runs.json").read_text())["workflow_runs"]
          summaries = []
          for run in runs:
              jobs = json.loads((root / f"ai-jobs-{run['id']}.json").read_text())["jobs"]
              summaries.append({
                  "id": run["id"],
                  "head_sha": run["head_sha"],
                  "status": run["status"],
                  "conclusion": run["conclusion"],
                  "jobs": [{
                      "name": job["name"],
                      "status": job["status"],
                      "conclusion": job["conclusion"],
                      "steps": [{
                          "name": step["name"],
                          "status": step["status"],
                          "conclusion": step["conclusion"],
                      } for step in job["steps"]],
                  } for job in jobs],
              })
          if not summaries:
              summaries = {"message": "No runs found for competition-ai-functions.yml"}
          (root / "ai-monitor.txt").write_text(
              "AI workflow states\n" + json.dumps(summaries, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Record status in a private tag
        run: |
          tag="competition-ai-monitor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --file "$RUNNER_TEMP/ai-monitor.txt"
          git push origin "refs/tags/$tag"
